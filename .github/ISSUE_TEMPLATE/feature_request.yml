name: 💡 功能建议 / Feature Request
description: 提出一个新功能或改进建议 / Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。提交前请先搜索已有 Issue，避免重复。
        请尽量说明「你为什么需要它」，而不只是「我想要什么」。

        Thank you for your suggestion. Please search existing issues first, and explain why you need it rather than only what you want.
  - type: dropdown
    id: category
    attributes:
      label: 功能分类 / Category
      options:
        - 频道与成员 / Channels and members
        - @ 提及与 hooks 拉起 / Mentions and hooks
        - 界面与外观 / UI and appearance
        - CLI / 接口 / CLI and HTTP API
        - 自动更新 / Auto update
        - 数据目录与迁移 / Data directory and migration
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题 / Problem to Solve
      description: 描述你遇到的具体场景，而不是只说想要某个功能。 / Describe the real scenario, not only the feature name.
      placeholder: |
        例如 / e.g.：我同时跑四个 agent，一个频道里消息一多，
        就分不清哪条是在回哪条，想找个引用功能。
        I run four agents at once. Once a channel gets busy I lose track of
        which message is answering which, so I want a quote-reply feature.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么做 / Proposed Solution
      description: 描述你设想的解决方案，不需要考虑技术实现。 / Describe the desired result; implementation details are optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你目前是怎么解决的 / Current Workaround
      description: 有没有用其他工具或方法绕过去？ / Are you using another tool or workaround?
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 我已搜索过已有 Issue，确认不是重复建议。 / I searched existing issues and this is not a duplicate.
          required: true
